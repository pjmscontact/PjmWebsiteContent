media:
  - name: carousels
    label: carousels
    input: media/images/carousels
    output: /media/images/carousels

content:
  - name: sections
    label: Sections
    type: object
    list:
      collapsible:
      collapsed: true
      summary: "{title} ({index})"
    fields:
      - name: title
        type: string
  - name: carousels
    label: carousels
    type: collection
    path: carousels
    filename: '{name}.json'
    fields:
      - name: title
        type: string
      - name: description
        type: rich-text
      - name: link
        type: string
      - name: imgUrl
        type: string
      - name: image
        label: Cover image
        type: image
        options:
          media: carousels
          path: /media/images/carousels
      - name: buttonAction
        type: select
        options: 
          values: [Send an Email, Donate,Watch on YouTube, Listen on Spotify]  
      - name: active
        type: boolean
        default: true
  - name: campaigns
    label: campaigns
    type: collection
    path: campaigns
    filename: '{name}.json'
    fields:
      - name: title
        type: string
      - name: description
        type: rich-text
      - name: link
        type: string
      - name: imgUrl
        type: string
      - name: buttonAction
        type: select
        options: 
          values: [Send an Email, Donate,Watch on YouTube, Listen on Spotify]
      - name: active
        type: boolean
        default: true
  - name: donations
    label: donations
    type: collection
    path: donations
    filename: '{name}.json'     
    fields:
      - name: name
        type: string
      - name: description
        type: rich-text
      - name: link
        type: string
      - name: imgUrl
        type: string
      - name: buttonAction
        type: select
        options: 
          values: [Send an Email, Donate,Watch on YouTube, Listen on Spotify]  
      - name: active
        type: boolean
        default: true
  - name: events
    label: events
    type: collection
    path: events
    filename: '{name}.json'
    fields:
      - name: id
        type: number
      - name: title
        type: string
      - name: description
        type: rich-text
      - name: link
        type: string
      - name: date
        type: date
        default: ""
        options:
        time: true
        format: dd-MM-yyyy'T'HH:mm
      - name: location
        type: string


